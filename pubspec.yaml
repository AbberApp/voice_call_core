name: voice_call_core
description: Private Flutter plugin for Abber App voice calls with WebRTC, recording, and cloud storage support.
version: 1.0.0
homepage: https://github.com/AbberApp/voice_call_core
repository: https://github.com/AbberApp/voice_call_core
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

flutter:
  plugin:
    platforms:
      android:
        package: co.abber.voice_call_core
        pluginClass: VoiceCallCorePlugin
      ios:
        pluginClass: VoiceCallCorePlugin
      web:
        pluginClass: VoiceCallCorePlugin
        fileName: voice_call_core_web.dart

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  
  # WebRTC & Communication
  flutter_webrtc: ^1.0.0
  flutter_callkit_incoming: ^2.5.3
  
  # Recording & Storage
  record: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_performance: ^0.11.0
  path_provider: ^2.1.5
  
  # Audio Session Management
  audio_session: ^0.1.25
  
  # HTTP & WebSocket
  dio: ^5.8.0
  
  # Utilities
  equatable: ^2.0.7
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - webrtc
  - voice-call
  - callkit
  - recording
  - flutter
  - dart
  - communication
  - voip
  - plugin